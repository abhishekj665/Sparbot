x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M
      max-file: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      # Keep Judge0 private to this machine. The Sparbot API is its only client.
      - "127.0.0.1:2358:2358"
    privileged: true
    cpus: "0.75"
    mem_limit: 768m
    pids_limit: 128
    <<: *default-logging
    restart: unless-stopped

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    # This is the only service that compiles and executes submissions.
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    <<: *default-logging
    restart: unless-stopped

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - data:/var/lib/postgresql/data/
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 10
    <<: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0.conf
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    <<: *default-logging
    restart: unless-stopped

volumes:
  data:
